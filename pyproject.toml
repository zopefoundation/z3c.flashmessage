# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[build-system]
requires = [
    "setuptools >= 78.1.1,< 82",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "z3c.flashmessage"
version = "4.2.dev0"
description = "A package for sending `flash messages` to users."
license = "ZPL-2.1"
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Framework :: Zope :: 3",
]
dynamic = ["readme"]
requires-python = ">=3.11"
authors = [
    {name = "Jasper Op de Coul", email = "jasper@infrae.com"},
    {name = "Christian Theune", email = "mail@gocept.com"},
]
maintainers = [
    {name = "Plone Foundation and contributors",email = "zope-dev@zope.dev"},
]
dependencies = [
    "setuptools",
    "ZODB",
    "zope.interface",
    "zope.schema",
    "zope.session",
]
keywords = ["zope3", "message", "zope", "session"]
[project.optional-dependencies]
test = [
    "zope.publisher",
    "zope.component",
    "zope.security",
    "zope.testrunner >= 6.4",
    "zope.app.wsgi[testlayer] >= 4.0",
    "Webtest",
]


[project.urls]
Source = "https://github.com/zopefoundation/z3c.flashmessage"
Issues = "https://github.com/zopefoundation/z3c.flashmessage/issues"
Changelog = "https://raw.githubusercontent.com/zopefoundation/z3c.flashmessage/master/CHANGES.rst"

[tool.coverage.run]
branch = true
source = ["z3c.flashmessage"]

[tool.coverage.report]
fail_under = 100
precision = 2
ignore_errors = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "self.fail",
    "raise AssertionError",
    "raise unittest.Skip",
]

[tool.coverage.html]
directory = "parts/htmlcov"

[tool.setuptools.dynamic]
readme = {file = ["src/z3c/flashmessage/README.rst", "CHANGES.rst"]}

[tool.zest-releaser]
create-wheel = false
extra-message = ""
upload-pypi = false
